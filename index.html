<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN Mail Filter Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 700px;
            padding: 50px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .header p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .icon-container {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 25px;
            border: 2px dashed #667eea;
            border-radius: 12px;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #667eea;
            font-weight: 600;
            gap: 10px;
        }

        .file-input-label:hover {
            background: #f0f2ff;
            border-color: #764ba2;
            color: #764ba2;
        }

        .file-input-label.has-file {
            border-style: solid;
            background: #e8f0ff;
            color: #667eea;
        }

        .file-name {
            display: none;
            color: #667eea;
            font-size: 14px;
            margin-top: 10px;
            padding: 10px;
            background: #f0f2ff;
            border-radius: 8px;
            text-align: center;
        }

        .file-name.show {
            display: block;
        }

        .score-input-group {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        .score-input-group input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            max-width: 120px;
        }

        .score-input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .hint-text {
            font-size: 12px;
            color: #999;
            margin-top: 8px;
            font-style: italic;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f0f2ff;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .status-container {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .status-container.show {
            display: block;
        }

        .status-loading {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .results {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .result-item {
            padding: 12px;
            background: white;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 13px;
            line-height: 1.6;
        }

        .result-item strong {
            color: #667eea;
        }

        .result-count {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            text-align: center;
            margin: 15px 0;
        }

        .download-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .download-link {
            display: inline-block;
            padding: 10px 15px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .download-link:hover {
            background: #667eea;
            color: white;
        }

        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .feature {
            text-align: center;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
        }

        .feature-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .feature-text {
            color: #666;
            font-size: 13px;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .features {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon-container">📧</div>
            <h1>VN Mail Filter Tool</h1>
            <p>Lọc email Việt Nam từ file danh sách.</p>
            <p style="color: #999; font-size: 13px;">Hỗ trợ: Gmail, Yahoo, Outlook, Yahoo.com.vn, Hotmail</p>
        </div>

        <form id="filterForm">
            <div class="form-group">
                <label>📁 Chọn File TXT</label>
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" accept=".txt" />
                    <label for="fileInput" class="file-input-label">
                        <span>➕</span>
                        <span>Nhấp để chọn file hoặc kéo thả</span>
                    </label>
                    <div class="file-name" id="fileName"></div>
                </div>
            </div>

            <div class="form-group">
                <label>🎯 Ngưỡng Điểm Lọc</label>
                <div class="score-input-group">
                    <input type="number" id="scoreInput" min="1" max="10" value="4" />
                </div>
                <div class="hint-text">
                    💡 4 = khả năng cao là mail Việt Nam | 2 = lọc rộng hơn | 1 = lọc tất cả
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-primary" id="submitBtn">
                    🚀 Bắt Đầu Lọc
                </button>
                <button type="reset" class="btn btn-secondary">
                    ↻ Đặt Lại
                </button>
            </div>
        </form>

        <div class="status-container" id="statusContainer">
            <div class="spinner"></div>
            <span id="statusText">Đang xử lý...</span>
        </div>

        <div class="results" id="results">
            <div class="result-count" id="resultCount">0</div>
            <div id="resultSummary"></div>
            <div class="download-links" id="downloadLinks"></div>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🔍</div>
                <div class="feature-text">Nhận diện Mail Việt</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🛡️</div>
                <div class="feature-text">An Toàn Dữ Liệu</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-text">Xử Lý Nhanh</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📊</div>
                <div class="feature-text">Thống Kê Chi Tiết</div>
            </div>
        </div>
    </div>

    <script>
        const ALLOWED_DOMAINS = {
            "gmail.com": true,
            "yahoo.com": true,
            "outlook.com": true,
            "yahoo.com.vn": true,
            "hotmail.com": true,
        };

        const VIET_SURNAMES = [
            "nguyen", "tran", "le", "pham", "hoang", "huynh", "vo", "vu",
            "bui", "do", "dang", "dinh", "ly", "trinh", "phan", "truong",
            "ngo", "duong", "mai", "cao", "ta", "to", "luu", "quach",
            "chau", "dau", "ho", "ha", "dao", "bach"
        ];

        const VIET_NAMES = [
            "anh", "bao", "binh", "chau", "chi", "chien", "cong", "cuong",
            "dat", "duc", "dung", "duy", "giang", "hanh", "hai", "hieu",
            "hoa", "hoai", "hung", "huy", "khanh", "khoa", "kien", "lan",
            "linh", "loan", "long", "mai", "manh", "minh", "nam", "nga",
            "ngan", "ngoc", "nhan", "nhi", "nhung", "phong", "phuoc",
            "phuc", "phuong", "quang", "quoc", "quy", "sang", "son",
            "tai", "tam", "tan", "thanh", "thao", "thien", "thinh",
            "thu", "thuy", "tien", "toan", "trang", "tri", "truc", "trung",
            "tuan", "tu", "tung", "uyen", "van", "viet", "vinh", "vy", "yen"
        ];

        const VIET_PLACES = [
            "vn", "hanoi", "hn", "saigon", "sg", "hcm", "danang", "dn",
            "haiphong", "hp", "dalat", "bmt", "camau", "dongnai", "haugiang",
            "longan", "baclieu", "soctrang", "cantho", "ct", "vungtau", "vt",
            "quangninh", "qn", "quangbinh", "qb", "binhduong", "bd", "daklak",
            "daknong", "gialai", "kontum", "hue", "nghean", "thanhhoa"
        ];

        const VIET_TEENCODE = [
            "kute", "kut3", "nhox", "nhok", "nhoc", "pe", "heo", "iu",
            "yeu", "yeuem", "anhyeuem", "maimai", "codon", "tinhyeu",
            "hotboy", "deptrai", "vip", "pro", "langtu", "congchua",
            "dethuong", "baby", "gaixinh", "boy", "xinh", "sock", "soc"
        ];

        const YEAR_RE = /(?:19[7-9][0-9]|20[0-1][0-9])/;
        const DAY_MONTH_RE = /(?:0[1-9]|[12][0-9]|3[01])(?:0[1-9]|1[0-2])/;
        const GEN_RE = /(?:8x|9x|10x)/;

        let selectedFile = null;

        document.getElementById('fileInput').addEventListener('change', function(e) {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                document.getElementById('fileName').textContent = `✓ ${selectedFile.name}`;
                document.getElementById('fileName').classList.add('show');
                document.querySelector('.file-input-label').classList.add('has-file');
            }
        });

        // Drag and drop
        const fileLabel = document.querySelector('.file-input-label');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            fileLabel.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            fileLabel.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            fileLabel.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            fileLabel.style.background = '#f0f2ff';
        }

        function unhighlight(e) {
            fileLabel.style.background = '#f8f9ff';
        }

        fileLabel.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            document.getElementById('fileInput').files = files;
            const event = new Event('change', { bubbles: true });
            document.getElementById('fileInput').dispatchEvent(event);
        }

        function containsAny(text, words) {
            return words.filter(word => word && text.includes(word));
        }

        // Regex để tìm email:password
        function extractEmailPassword(text) {
            // Pattern: email@domain:password
            // Email: [a-zA-Z0-9._%+\-]+@(gmail\.com|yahoo\.com|outlook\.com|yahoo\.com\.vn|hotmail\.com)
            // Password: bất kỳ ký tự nào sau dấu :
            const pattern = /([a-zA-Z0-9._%+\-]+@(?:gmail\.com|yahoo\.com|outlook\.com|yahoo\.com\.vn|hotmail\.com)):(.+?)(?:\s|$)/gi;
            const matches = [];
            let match;
            
            while ((match = pattern.exec(text)) !== null) {
                matches.push({
                    email: match[1].toLowerCase(),
                    password: match[2].trim()
                });
            }
            
            return matches;
        }

        function scoreVietnameseEmail(email) {
            const local = email.split('@')[0].toLowerCase();
            let score = 0;
            let reasons = [];

            const foundSurnames = containsAny(local, VIET_SURNAMES);
            if (foundSurnames.length > 0) {
                score += 3;
                reasons.push(`họ Việt: ${foundSurnames.slice(0, 3).join(', ')}`);
            }

            const foundNames = containsAny(local, VIET_NAMES);
            if (foundNames.length > 0) {
                score += 2;
                reasons.push(`tên Việt: ${foundNames.slice(0, 3).join(', ')}`);
            }

            const foundPlaces = containsAny(local, VIET_PLACES);
            if (foundPlaces.length > 0) {
                score += 1;
                reasons.push(`địa danh/viết tắt: ${foundPlaces.slice(0, 3).join(', ')}`);
            }

            const foundTeencode = containsAny(local, VIET_TEENCODE);
            if (foundTeencode.length > 0) {
                score += 1;
                reasons.push(`teencode: ${foundTeencode.slice(0, 3).join(', ')}`);
            }

            if (YEAR_RE.test(local) || GEN_RE.test(local)) {
                score += 1;
                reasons.push('có năm sinh/thế hệ');
            }

            if (DAY_MONTH_RE.test(local)) {
                score += 1;
                reasons.push('có dạng ngày-tháng');
            }

            let level = "Không đủ căn cứ";
            if (score >= 4) {
                level = "Khả năng cao là mail Việt Nam";
            } else if (score >= 2) {
                level = "Có thể là mail Việt Nam";
            }

            return {
                score,
                level,
                reason: reasons.length > 0 ? reasons.join('; ') : 'không có dấu hiệu rõ'
            };
        }

        document.getElementById('filterForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!selectedFile) {
                alert('Vui lòng chọn file TXT');
                return;
            }

            const minScore = parseInt(document.getElementById('scoreInput').value);
            const statusContainer = document.getElementById('statusContainer');
            const results = document.getElementById('results');

            statusContainer.classList.add('show');
            results.classList.remove('show');

            try {
                const content = await selectedFile.text();
                const lines = content.split('\n');

                const seen = new Set();
                const rows = [];
                const domainCounter = {};
                const levelCounter = {};

                for (const line of lines) {
                    if (!line.trim()) continue;

                    // Tìm tất cả email:password trong dòng
                    const matches = extractEmailPassword(line);
                    
                    if (matches.length === 0) continue;

                    for (const match of matches) {
                        const email = match.email;
                        const password = match.password;
                        const domain = email.split('@')[1];

                        if (!ALLOWED_DOMAINS[domain]) continue;
                        if (seen.has(email)) continue;

                        seen.add(email);

                        const { score, level, reason } = scoreVietnameseEmail(email);

                        if (score >= minScore) {
                            rows.push({ email, password, domain, score, level, reason });
                            domainCounter[domain] = (domainCounter[domain] || 0) + 1;
                            levelCounter[level] = (levelCounter[level] || 0) + 1;
                        }
                    }
                }

                rows.sort((a, b) => b.score - a.score || a.domain.localeCompare(b.domain));

                statusContainer.classList.remove('show');

                // Display results
                document.getElementById('resultCount').textContent = rows.length;

                let summaryHtml = '<div style="text-align: left; margin: 15px 0;">';
                summaryHtml += '<strong>📊 Thống Kê:</strong><br>';
                summaryHtml += `Tổng email được lọc: <strong>${rows.length}</strong><br><br>`;

                summaryHtml += '<strong>Theo Domain:</strong><br>';
                for (const [domain, count] of Object.entries(domainCounter)) {
                    summaryHtml += `• ${domain}: <strong>${count}</strong><br>`;
                }

                summaryHtml += '<br><strong>Theo Mức Nhận Diện:</strong><br>';
                for (const [level, count] of Object.entries(levelCounter)) {
                    summaryHtml += `• ${level}: <strong>${count}</strong><br>`;
                }
                summaryHtml += '</div>';

                document.getElementById('resultSummary').innerHTML = summaryHtml;

                // Generate download links
                const downloadLinksHtml = `
                    <button class="download-link" onclick="downloadCSV(${JSON.stringify(rows).replace(/"/g, '&quot;')})">
                        📥 Tải CSV (Đầy Đủ)
                    </button>
                    <button class="download-link" onclick="downloadTXT(${JSON.stringify(rows).replace(/"/g, '&quot;')})">
                        📥 Tải TXT (Email:Password)
                    </button>
                `;
                document.getElementById('downloadLinks').innerHTML = downloadLinksHtml;

                results.classList.add('show');

            } catch (error) {
                alert('Lỗi: ' + error.message);
                statusContainer.classList.remove('show');
            }
        });

        function downloadCSV(rows) {
            let csv = 'Email,Password,Domain,Score,Level,Reason\n';
            rows.forEach(row => {
                csv += `"${row.email}","${row.password}","${row.domain}",${row.score},"${row.level}","${row.reason}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `vn_mail_filtered_${new Date().getTime()}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function downloadTXT(rows) {
            let txt = 'VN Mail Filter - Email:Password List\n';
            txt += '='.repeat(50) + '\n\n';
            rows.forEach(row => {
                txt += `${row.email}:${row.password}\n`;
            });
            txt += `\nTổng cộng: ${rows.length} email\n`;

            const blob = new Blob([txt], { type: 'text/plain;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `vn_mail_filtered_${new Date().getTime()}.txt`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
